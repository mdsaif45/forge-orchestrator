name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Electron binary
        run: npm run setup

      - name: Run verification checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run check:router
          npm run check:docs
          npm run smoke
          npm run check:ui

      - name: Package installer and portable binaries
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          # A tag with a prerelease identifier (v0.1.0-alpha.1, -beta.1, -rc.1) is not GA and
          # must not be flagged "Latest" or trigger stable-channel auto-update — hardcoding
          # `false` here would have marked an alpha as a general release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
