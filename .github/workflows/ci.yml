name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows a re-run without pushing an empty commit.
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: everything that needs no display and no Electron binary.
  static:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `.npmrc` sets ignore-scripts, so this installs no native binaries. This
      # job never launches the app, so Electron's binary is not fetched either —
      # saving roughly 100MB per run.
      - name: Install dependencies
        run: npm ci

      # node-pty ships no linux-x64 prebuild, so the process tests cannot load it
      # without a build. Electron is still skipped; this is the pty alone.
      - name: Build node-pty
        run: npm run setup:pty

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Router contract checks
        run: npm run check:router

  # Anything that launches Electron needs its binary and a display.
  app:
    name: App checks (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `.npmrc` skips install scripts, because npm would otherwise try to compile
      # better-sqlite3 from source despite its working prebuilds. Electron's binary
      # is the one thing that genuinely needs fetching.
      - name: Fetch the Electron binary
        run: npm run setup

      - name: Verify the Electron binary is present
        # Without this, a missing binary surfaces as "Error: Electron uninstall"
        # from a later step, which points at the wrong cause.
        run: |
          test -f node_modules/electron/path.txt \
            || { echo "Electron binary missing — postinstall did not run"; exit 1; }

      - name: Fix the Chromium sandbox helper permissions
        # Electron's setuid sandbox helper must be owned by root with mode 4755.
        # npm extracts it as the runner user, so Chromium refuses to start rather
        # than run unsandboxed. Correcting the ownership keeps the sandbox ON —
        # passing --no-sandbox would disable the very isolation these checks
        # exist to verify.
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - run: npm run build

      # Electron needs an X server on Linux; xvfb-run provides a virtual one.
      - name: Process boundary checks
        run: xvfb-run --auto-servernum npm run smoke

      - name: Design system checks
        run: xvfb-run --auto-servernum npm run check:ui

      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e

  # The app ships on Windows, so it is built and exercised there too.
  windows:
    name: App checks (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Electron binary
        run: npm run setup

      - run: npm run build
      - run: npm run smoke
      - run: npm run check:ui
      - run: npm run test:e2e
